name: SBOM Generation (Syft)

on:
  push:
    branches: [ "main", "feature/controles-seguridad" ]
  pull_request:
    branches: [ "main" ]
jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t api-demo:${{ github.sha }} .

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: api-demo:${{ github.sha }}
          format: spdx-json
          output-file: pago-directo-sbom.spdx.json

      - name: Publicar SBOM como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: pago-directo-sbom.spdx.json
          retention-days: 30
