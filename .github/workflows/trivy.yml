name: Container Security (Trivy)

on:
  push:
    branches: [ "main", "feature/controles-seguridad" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: |
          docker build -t api-demo:${{ github.sha }} .

      - name: Ejecutar escáner Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-demo:${{ github.sha }}'
          format: 'table'
          output: 'trivy-report.txt'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          # El exit-code 1 rompe el pipeline si encuentra vulnerabilidades (Quality Gate)
          exit-code: '1' 

      - name: Publicar reporte como Artefacto
        uses: actions/upload-artifact@v4
        if: always() # Asegura que el reporte se guarde incluso si el paso anterior falla
        with:
          name: reporte-vulnerabilidades-trivy
          path: 'trivy-report.txt'
          retention-days: 5
